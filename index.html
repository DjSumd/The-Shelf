<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<meta name="theme-color" content="#161413">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shelf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem("cp-theme");}catch(e){}if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<style>
:root{
  --wash1:#F4EFFD; --wash2:#FDF1EC; --wash3:#FFF4EC;
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#2A2940; --ink2:#4A4960; --muted:#8A889E;
  --line:#EEEBF5; --soft:#F7F5FB; --accent:#6B5BD6;
  --shadow:0 2px 6px rgba(60,50,110,.05),0 18px 40px -20px rgba(60,50,110,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --wash1:#2A2321; --wash2:#2E2224; --wash3:#2C2620;
  --bg:#161413; --card:#211D1C; --ink:#F0E6D8; --ink2:#D4C7B5; --muted:#9E907F;
  --line:#352D2A; --soft:#2A2422; --accent:#C9A45C;
  --shadow:0 2px 6px rgba(0,0,0,.35),0 18px 40px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --wash1:#2A2321; --wash2:#2E2224; --wash3:#2C2620;
  --bg:#161413; --card:#211D1C; --ink:#F0E6D8; --ink2:#D4C7B5; --muted:#9E907F;
  --line:#352D2A; --soft:#2A2422; --accent:#C9A45C;
  --shadow:0 2px 6px rgba(0,0,0,.35),0 18px 40px -20px rgba(0,0,0,.75);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:340px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 15% 0%,rgba(246,197,176,.35),transparent 60%),radial-gradient(110% 90% at 90% 0%,rgba(184,169,232,.35),transparent 62%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 20px 130px}
.serif{font-family:"Cormorant Garamond","Iowan Old Style",Georgia,serif}

.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mark{width:30px;height:30px;flex:none}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.75rem;font-weight:600;margin:0;flex:1;letter-spacing:.005em}
.sub{color:var(--muted);font-size:.86rem;font-weight:700;white-space:nowrap}

/* Cards */
.card{background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.scene{position:relative}
.banner{display:block;width:100%;height:230px}
.card.small .banner{height:118px}
.pill{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--tc);font-size:.78rem;font-weight:800}
.pill svg{width:15px;height:15px}
.card-body{padding:20px 22px 24px}
.card-title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.05rem;line-height:1.08;margin:0 0 12px;letter-spacing:-.005em}
.card.small .card-title{font-size:1.6rem;margin-bottom:8px}
.card-text{font-size:1.06rem;line-height:1.7;margin:0;color:var(--ink2)}
.card.small .card-text{font-size:1rem}
.card-src{margin-top:16px;font-size:.86rem;color:var(--muted);line-height:1.4}
.card-src cite{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.08rem;font-weight:600;color:var(--ink2)}
.card-src svg{display:none}

.eg{margin-top:18px;padding:16px 18px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 30%,transparent),color-mix(in srgb,var(--tb) 45%,transparent))}
.eg h3,.eg summary{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:800;color:var(--tc);margin:0;list-style:none;letter-spacing:.01em}
.eg summary{cursor:pointer}
.eg summary::-webkit-details-marker{display:none}
.eg summary::after{content:"+";margin-left:auto;font-size:1.15rem;line-height:1;font-weight:600}
.eg[open] summary::after{content:"–"}
.eg svg{width:16px;height:16px}
.eg p{margin:7px 0 0;font-size:.98rem;line-height:1.65;color:var(--ink2)}

.reflect{margin-top:18px;padding:16px 18px;border-radius:22px;background:var(--soft)}
.reflect h3,.reflect summary{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:800;color:var(--tc);margin:0;list-style:none}
.reflect summary{cursor:pointer}
.reflect summary::-webkit-details-marker{display:none}
.reflect summary::after{content:"+";margin-left:auto;font-size:1.15rem;line-height:1;font-weight:600}
.reflect[open] summary::after{content:"–"}
.reflect svg{width:16px;height:16px}
.rq{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;font-weight:600;line-height:1.25;margin:8px 0 10px;color:var(--ink)}
.rf{background:var(--card);min-height:84px;resize:vertical;line-height:1.55}
.rs{margin:7px 2px 0;font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--card);border-radius:999px;padding:12px 19px;font-weight:700;font-size:.94rem;
  box-shadow:0 1px 3px rgba(60,50,110,.08),0 6px 16px -10px rgba(60,50,110,.35);color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--tc,var(--accent));background:linear-gradient(135deg,var(--tc,var(--accent)),color-mix(in srgb,var(--tc,var(--accent)) 70%,#fff));color:#fff;box-shadow:0 10px 24px -12px var(--tc,var(--accent))}
.btn.kept{background:var(--soft);background:color-mix(in srgb,var(--ta,#ddd) 45%,var(--card));color:var(--tc,var(--accent))}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);padding:9px 11px}
.btn:disabled{opacity:.55;cursor:default}

.progress{display:flex;gap:8px;justify-content:center;margin:2px 0 18px}
.progress i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .3s}
.progress i.now{width:26px;border-radius:5px}

/* Today intro */
.hero{position:relative;border-radius:34px;overflow:hidden;box-shadow:var(--shadow);min-height:540px;min-height:max(540px,calc(100svh - 210px));display:flex;flex-direction:column;justify-content:flex-end}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;background:radial-gradient(90% 60% at 50% 55%,rgba(40,30,90,.18),transparent 75%);padding:28px 26px 34px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.hero h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.6rem;line-height:1;margin:0 0 8px;color:#fff;text-shadow:0 2px 16px rgba(40,30,80,.18)}
.hero p{margin:0 auto 24px;max-width:30ch;color:rgba(255,255,255,.95);font-weight:700;text-shadow:0 1px 10px rgba(40,30,80,.25)}
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto 26px;position:relative;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,255,255,.35) 55%,rgba(255,255,255,.08) 72%);
  box-shadow:0 0 60px 10px rgba(255,255,255,.35);animation:breathe 8s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);animation:breathe 8s ease-in-out infinite reverse}
.breath-label{color:#fff;font-weight:700;font-size:.85rem;letter-spacing:.02em;opacity:.9;margin:-8px 0 20px}
@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1.06)}}
.btn.light{align-self:center;background:rgba(255,255,255,.92);color:#3B3566;padding:14px 28px;font-size:1rem}
.today-head{text-align:center;margin:0 0 6px}
.today-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.7rem;margin:0}

.done{text-align:center}
.done .hero{min-height:420px}
h2.sec{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.1rem;line-height:1.05;margin:6px 0 14px}
.field{width:100%;border:0;background:var(--soft);border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.field:focus{background:var(--card)}
.search{position:relative;margin-bottom:16px}
.search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search .field{padding-left:44px;border-radius:999px}
textarea.field{min-height:120px;resize:vertical}
.row{display:flex;gap:8px}
.row .field{flex:1}
.stack>*+*{margin-top:22px}
.note{color:var(--muted);font-size:.9rem}
.err{color:#C0395B;font-size:.92rem}
.empty{border-radius:28px;padding:34px 22px;text-align:center;color:var(--muted);background:linear-gradient(160deg,var(--wash1),var(--wash2))}
.empty strong{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;color:var(--ink);font-weight:600;margin-bottom:4px}
label.lbl{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.mini-actions{display:flex;gap:2px;padding:0 14px 14px;flex-wrap:wrap}
.gen{border-radius:26px;padding:16px;margin:6px 0 22px;background:linear-gradient(135deg,var(--wash1),var(--wash2) 60%,var(--wash3))}
.gen p{margin:9px 4px 0}

/* Topic tiles */
.tiles{display:flex;gap:12px;overflow-x:auto;margin:0 -20px 18px;padding:6px 20px 14px;scroll-snap-type:x proximity;scroll-padding:0 20px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 148px;height:150px;border-radius:28px;border:0;background:linear-gradient(165deg,var(--ta),var(--tb));color:var(--tc);padding:14px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.35)}
.tile::after{content:"";position:absolute;left:-20px;right:-20px;bottom:-40px;height:80px;border-radius:50%;background:rgba(255,255,255,.28)}
.tile .ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;position:relative;z-index:1}
.tile svg{width:22px;height:22px}
.tile b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.05rem;overflow-wrap:break-word;letter-spacing:-.01em;font-weight:700;line-height:1.02;position:relative;z-index:1;color:var(--ink)}
.tile small{display:block;font-family:"Nunito",sans-serif;font-weight:700;color:var(--tc);font-size:.74rem;margin-top:4px}
.tile.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:0;background:var(--soft);border-radius:999px;padding:8px 15px;font-size:.88rem;font-weight:700;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.chip.on{background:linear-gradient(135deg,var(--ta,#E7E3F7),var(--tb,#F3F1FA));color:var(--tc,var(--ink))}

/* Tabs */
.tabs{background:var(--card);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:30px;box-shadow:0 12px 40px -12px rgba(60,50,110,.35),0 0 0 1px var(--line);z-index:5}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tab{background:none;border:0;padding:8px 4px;border-radius:24px;font-size:.72rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.badge{position:absolute;top:4px;left:calc(50% + 7px);min-width:18px;padding:0 5px;border-radius:9px;background:#E0668A;color:#fff;font-size:.66rem;line-height:18px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(40,35,70,.4);backdrop-filter:blur(3px);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:32px 32px 0 0;padding:0 0 calc(26px + env(safe-area-inset-bottom,0px))}
.sheet .banner{height:150px}
.sheet-in{padding:20px 22px 0}
.sheet-in h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.9rem;line-height:1.05;margin:0 0 6px}
.sec-block{margin-top:14px;padding:16px 18px;border-radius:22px;background:var(--soft)}
.sec-block:nth-of-type(odd){background:linear-gradient(135deg,color-mix(in srgb,var(--ta) 28%,transparent),color-mix(in srgb,var(--tb) 40%,transparent))}
.sec-block h4{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:800;margin:0 0 5px;color:var(--tc)}
.sec-block h4 svg{width:17px;height:17px}
.sec-block p{margin:0;font-size:1rem;line-height:1.65;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:700;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* Evening theme: charcoal, oxblood and brass */
:root[data-theme="dark"] body::before{background:radial-gradient(120% 90% at 15% 0%,rgba(110,31,42,.35),transparent 60%),radial-gradient(110% 90% at 90% 0%,rgba(201,164,92,.18),transparent 62%)}
:root[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#D6B46E,#A8843F);color:#1A1716;box-shadow:0 10px 24px -12px rgba(201,164,92,.7)}
:root[data-theme="dark"] .btn{box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .btn.ghost{box-shadow:none}
:root[data-theme="dark"] .btn.light{background:rgba(240,230,216,.92);color:#2A1D1A}
:root[data-theme="dark"] .pill{background:rgba(22,20,19,.6)}
:root[data-theme="dark"] .tile .ic{background:rgba(255,255,255,.08)}
:root[data-theme="dark"] .tile svg{color:var(--tc)}
:root[data-theme="dark"] .tile::before,:root[data-theme="dark"] .tile::after{background:rgba(255,255,255,.05)}
:root[data-theme="dark"] .tab.on{color:#D6B46E;background:rgba(201,164,92,.12)}
:root[data-theme="dark"] .fam.on{background:#5A1A24;color:#F0E6D8}
.theme-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--ink2);display:grid;place-items:center;flex:none}
.theme-btn svg{width:19px;height:19px}
.fams{display:flex;gap:4px;margin:0 0 14px;padding:4px;background:var(--soft);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.fams::-webkit-scrollbar{display:none}
.fam{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 12px;font-weight:800;font-size:.86rem;color:var(--muted);white-space:nowrap}
.fam.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -4px rgba(60,50,110,.35)}
.hero-link{align-self:center;color:rgba(255,255,255,.92);margin-top:10px;font-size:.88rem}
.hero-link svg{width:16px;height:16px}
.fams.mode{margin-bottom:12px}
.fam-lbl{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.books{display:flex;flex-direction:column;gap:8px}
.bookrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 1px 3px rgba(60,50,110,.06),0 0 0 1px var(--line)}
.bk-dots{display:flex;flex-direction:column;gap:3px;flex:none}
.bk-dots i{width:7px;height:7px;border-radius:50%}
.bk-main{flex:1;min-width:0}
.bk-main cite{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:1.18rem;line-height:1.15;color:var(--ink)}
.bk-main small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.bk-n{flex:none;min-width:30px;height:30px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--ink2)}
.journey{border-radius:28px;padding:20px 20px 18px;margin:0 0 18px;background:linear-gradient(150deg,var(--wash1),var(--wash2) 60%,var(--wash3))}
.journey h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.5rem;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;font-weight:700;line-height:1}
.stat span{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.2}
.famrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.famrow span{width:48px;font-size:.84rem;font-weight:800}
.famrow small{width:74px;text-align:right;font-size:.76rem;color:var(--muted);font-weight:700}
.journey.backup{padding-bottom:16px}
.chk{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:.74rem;font-weight:800;color:var(--tc,var(--accent));opacity:.85}
.chk svg{width:13px;height:13px}
.card-src{display:flex;flex-direction:column;align-items:flex-start}
.chg{padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.chg small{color:var(--muted)}
.order{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.sheet.rand{padding:14px 14px calc(22px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.rand-top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.rand-top .note{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.rand-top svg{width:16px;height:16px}
.top .theme-btn + .theme-btn{margin-left:-4px}
@media (max-width:420px){.top .sub{display:none}.brand{font-size:1.6rem}}
.grow{display:flex;align-items:center;gap:12px;margin:-4px 0 18px;flex-wrap:wrap}
.meter{flex:1;min-width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tc);border-radius:3px}
@supports not (color: color-mix(in srgb, red, blue)){ .eg,.sec-block:nth-of-type(odd){background:var(--soft)} }
.reveal{animation:in .5s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal,.orb,.orb::after{animation:none}.toast,.progress i{transition:none}}


.shelf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cover{display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink)}
.cover .banner{height:96px}
.cv-body{display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px;flex:1}
.cv-body b{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.18rem;line-height:1.08;font-weight:700}
.cv-body small{color:var(--muted);font-size:.78rem;font-weight:600}
.cv-meta{display:inline-flex;align-items:center;gap:4px;margin-top:auto;padding-top:8px;font-size:.74rem;font-weight:800;color:var(--tc)}
.cv-meta svg{width:13px;height:13px}
.cover .meter{flex:none;min-width:0;height:4px;margin-top:6px}
.list-h{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.5rem;margin:24px 0 10px}
.stories{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:0;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 0 0 1px var(--line)}
.sn{flex:none;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--soft);color:var(--tc)}
.sn svg{width:15px;height:15px}
.st b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.18rem;line-height:1.15;color:var(--ink)}
.st small{display:block;color:var(--muted);font-size:.84rem;margin-top:3px;line-height:1.4}
.reader p{font-size:1.07rem;line-height:1.75;color:var(--ink2);margin:0 0 14px}
.reader .eg p,.reader .take p{margin:6px 0 0}
.reader-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.take{margin-top:16px;padding:16px 18px;border-radius:22px;border:1.5px solid color-mix(in srgb,var(--tc) 35%,transparent)}
.take span{font-size:.78rem;font-weight:800;color:var(--tc);letter-spacing:.02em}
.take p{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem !important;line-height:1.3 !important;color:var(--ink) !important;font-weight:600}

.cover{position:relative}
.cv-saved{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);color:var(--tc);z-index:1}
.cv-saved svg{width:16px;height:16px}
:root[data-theme="dark"] .cv-saved{background:rgba(22,20,19,.7)}
.tile{flex:0 0 150px}
.tile b{font-size:1.12rem}
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -20px 8px;padding:4px 20px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .cover{flex:0 0 160px;scroll-snap-align:start}
.fam-head{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.fam-head .fam-lbl{margin:10px 0 6px}
.fam-head .btn{padding:6px 8px;font-size:.84rem}
.fam-head .btn svg{width:15px;height:15px}
.sub-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sub-head .sec{margin-bottom:10px;color:var(--ink)}
.chip i{background:var(--tc)}
.hero .btn.ghost.hero-link{color:#fff;text-shadow:0 1px 8px rgba(40,30,80,.35)}
</style>
</head>

function seeded(n){ let a = n>>>0; return () => { a = (a + 0x6D2B79F5)|0; let t = Math.imul(a ^ (a>>>15), 1|a); t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14))>>>0)/4294967296; }; }

    else if(kind===1){ const a2=8+r()*10; d = `M0 ${f(base)} Q 50 ${f(base-a2)} 100 ${f(base)} T 200 ${f(base)} T 300 ${f(base)} T 400 ${f(base)} L400 220 L0 220Z`; }
    else if(kind===2){ const peak=60+r()*280; d = `M0 ${f(base+10)} L ${f(peak-90)} ${f(base-10)} L ${f(peak)} ${f(base-55-r()*25)} L ${f(peak+100)} ${f(base-5)} L 400 ${f(base+5)} L400 220 L0 220Z`; }

/* ---------- state ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const str = v => typeof v === "string" ? v : (v == null ? "" : String(v));
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
const STORES = ["state","notes","written","drafts"];
const U = {state:0, notes:0, written:0, drafts:0};
let S = {kept:[], read:[], last:null, days:[], books:[]}, N = {}, W = {}, DR = {};
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
let storageWarned = false;
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ if(!storageWarned){ storageWarned = true; setTimeout(()=>toast("This device's storage for the app is full. Consider a backup."), 50); } return false; } }
function getStore(n){ return n==="state"?S:n==="notes"?N:n==="drafts"?DR:W; }
function setStore(n,v){ if(n==="state") S = v; else if(n==="notes") N = v; else if(n==="drafts") DR = v; else W = v; }
for(const n of STORES){ const w = lsGet("sh-"+n); if(w && "data" in w){ setStore(n, w.data); U[n] = w.updatedAt||0; } }
function cleanStory(s){ return {title:str(s.title).slice(0,140), text:str(s.text).replace(/\u2014/g,", ").slice(0,6500), example:str(s.example).replace(/\u2014/g,", ").slice(0,1600), takeaway:str(s.takeaway).replace(/\u2014/g,", ").slice(0,300)}; }
function normalise(){
  if(!isObj(S)) S = {};
  const arr = (v,t) => Array.isArray(v) ? v.filter(t) : [];
  const ids = new Set();
  S.kept = arr(S.kept, k => isObj(k) && typeof k.id==="string" && !ids.has(k.id) && ids.add(k.id)).map(k=>({id:k.id, keptAt:Number.isFinite(k.keptAt)?k.keptAt:Date.now(), interval:Number.isFinite(k.interval)&&k.interval>0?k.interval:1, due:Number.isFinite(k.due)?k.due:0}));
  S.read = [...new Set(arr(S.read, x => typeof x==="string"))];
  S.days = [...new Set(arr(S.days, x => Number.isFinite(x)))];
  const bids = new Set();
  S.books = arr(S.books, k => isObj(k) && typeof k.id==="string" && BOOKMAP[k.id] && !bids.has(k.id) && bids.add(k.id)).map(k=>({id:k.id, savedAt:Number.isFinite(k.savedAt)?k.savedAt:Date.now()}));
  S.last = isObj(S.last) && BOOKMAP[S.last.book] && Number.isFinite(S.last.i) ? {book:S.last.book, i:S.last.i} : null;
  if(!isObj(N)) N = {};
  for(const k of Object.keys(N)) if(!isObj(N[k]) || typeof N[k].text!=="string" || !N[k].text.trim()) delete N[k];
  if(!isObj(DR)) DR = {};
  for(const k of Object.keys(DR)){ const d = DR[k]; if(!BOOKMAP[k] || !isObj(d) || !Array.isArray(d.outline)){ delete DR[k]; continue; } d.stories = Array.isArray(d.stories) ? d.stories.filter(s=>isObj(s) && str(s.text).trim()).map(cleanStory) : []; }
  if(!isObj(W)) W = {};
  for(const k of Object.keys(W)){
    const w = W[k];
    if(!BOOKMAP[k] || !isObj(w) || !Array.isArray(w.stories)){ delete W[k]; continue; }
    w.stories = w.stories.filter(s => isObj(s) && str(s.title).trim() && str(s.text).trim()).map(cleanStory);
    if(!w.stories.length) delete W[k];
  }
}
normalise();

let sample = null, cloud = null, dl = null;
const cloudTimers = {}, CHUNK = 90000, cloudParts = {};
function saveStore(n){
  U[n] = Date.now();
  lsSet("sh-"+n, {data:getStore(n), updatedAt:U[n]});
  if(cloud){ clearTimeout(cloudTimers[n]); cloudTimers[n] = setTimeout(()=>cloudSave(n), 800); }
}
const persist = () => saveStore("state");
async function cloudSave(n){
  try{
    const s = JSON.stringify(getStore(n)), parts = [];
    for(let i=0;i<s.length;i+=CHUNK) parts.push(s.slice(i,i+CHUNK));
    const prev = cloudParts[n] || [];
    for(let i=0;i<parts.length;i++) if(prev[i] !== parts[i]) await cloud.doc(`sh-${n}-${i}`).set({part:parts[i]});
    cloudParts[n] = parts;
    await cloud.doc(`sh-${n}`).set({parts:parts.length, updatedAt:U[n]});
  }catch(e){}
}
async function cloudLoad(n){
  const meta = await cloud.doc(`sh-${n}`).get();
  if(!meta.exists) return null;
  const m = meta.data();
  const docs = await Promise.all(Array.from({length:m.parts}, (_,i)=>cloud.doc(`sh-${n}-${i}`).get()));
  const bits = []; for(const d of docs){ if(!d.exists) return null; bits.push(d.data().part); }
  cloudParts[n] = bits;
  return {data:JSON.parse(bits.join("")), updatedAt:m.updatedAt||0};
}

/* ---------- content helpers ---------- */
const dayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*60000)/DAY);
function storiesOf(id){ return (handDone(id) && BUILTIN[id]) || (W[id] && W[id].stories) || BUILTIN[id] || []; }
const isWritten = id => storiesOf(id).length > 0;
const storyId = (b,i) => `${b}~${i}`;
function story(sid){ const [b,i] = String(sid).split("~"); const s = storiesOf(b)[+i]; return s && BOOKMAP[b] ? Object.assign({id:sid, book:b, i:+i, topic:BOOKMAP[b].topic}, s) : null; }
const isRead = sid => S.read.includes(sid);
function readCount(b){ return storiesOf(b).filter((_,i)=>isRead(storyId(b,i))).length; }
function markRead(sid){ if(!isRead(sid)){ S.read = [...S.read, sid]; persist(); } }
function markDay(){ const d = dayNum(); if(!S.days.includes(d)){ S.days = [...S.days, d]; persist(); } }
const isKept = sid => S.kept.some(k=>k.id===sid);
function toggleKeep(sid){
  if(isKept(sid)){ S.kept = S.kept.filter(k=>k.id!==sid); toast("Removed from saved"); }
  else { S.kept.unshift({id:sid, keptAt:Date.now(), interval:1, due:dayNum()+1}); toast("Saved"); }
  persist(); refreshKeep(sid);
}
const isBookSaved = id => (S.books||[]).some(k=>k.id===id);
function toggleBook(id){
  if(isBookSaved(id)){ S.books = S.books.filter(k=>k.id!==id); toast("Book removed from saved"); }
  else { S.books = [{id, savedAt:Date.now()}, ...(S.books||[])]; toast("Book saved"); }
  persist(); render();
}
const bookSaveBtn = id => `<button class="btn ${isBookSaved(id)?"kept":""}" data-savebook="${esc(id)}">${ico(UI.bookmark, isBookSaved(id)?'fill="currentColor"':"")}${isBookSaved(id)?"Book saved":"Save book"}</button>`;
const keepInner = sid => `${ico(UI.bookmark, isKept(sid)?'fill="currentColor"':"")}${isKept(sid)?"Saved":"Save"}`;
function refreshKeep(sid){ document.querySelectorAll(`.btn[data-keep="${CSS.escape(sid)}"]:not(.ghost)`).forEach(b=>{ b.classList.toggle("kept", isKept(sid)); b.innerHTML = keepInner(sid); }); }
function toast(msg){ const t = document.getElementById("toast"); if(!t) return; t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"),1700); }
function seeded(n){ let a = n>>>0; return () => { a = (a + 0x6D2B79F5)|0; let t = Math.imul(a ^ (a>>>15), 1|a); t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14))>>>0)/4294967296; }; }
function allStories(){ const out = []; for(const b of BOOKS) storiesOf(b.id).forEach((_,i)=>out.push(storyId(b.id,i))); return out; }

/* ---------- read aloud ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
let speakingId = null;
function pickVoice(){ const v = speechSynthesis.getVoices(); return v.find(x=>/en-AU/i.test(x.lang)) || v.find(x=>/en-GB/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }
function stopSpeech(){ if(canSpeak && speakingId){ speechSynthesis.cancel(); speakingId = null; setListen(); } }
function setListen(){ document.querySelectorAll("[data-listen]").forEach(b=>{ const on = b.dataset.listen===speakingId; b.innerHTML = ico(on?UI.stop:UI.listen)+(on?"Stop":"Listen"); }); }
function speak(sid){
  if(!canSpeak) return;
  if(speakingId===sid){ stopSpeech(); return; }
  speechSynthesis.cancel();
  const s = story(sid); if(!s) return;
  const text = `${s.title}. ${s.text} ${BOOKMAP[s.book].theory?"Try it.":"In real life."} ${s.example} The takeaway. ${s.takeaway}`;
  const chunks = (text.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const v = pickVoice(); speakingId = sid; setListen(); let i = 0;
  const next = () => { if(speakingId!==sid) return; if(i>=chunks.length){ speakingId = null; setListen(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i++]); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-AU"; u.rate = .94;
    u.onend = next; u.onerror = e => { if(e && (e.error==="interrupted"||e.error==="canceled")) return; if(speakingId===sid){ speakingId = null; setListen(); } };
    try{ speechSynthesis.speak(u); }catch(err){ speakingId = null; setListen(); } };
  next();
}
const listenBtn = sid => canSpeak ? `<button class="btn" data-listen="${esc(sid)}">${ico(speakingId===sid?UI.stop:UI.listen)}${speakingId===sid?"Stop":"Listen"}</button>` : "";

let tab = "today", view = null, shelfFam = "All", shelfSub = null, shelfFilter = "all", shelfQuery = "", reviewShow = false, savedMode = "books", savedFam = "All";

function reflectHTML(sid){

function coverHTML(b){

  return `<button class="cover" data-book="${esc(b.id)}" style="${tstyle(b.topic)}">

    ${n?`<span class="meter"><i style="width:${pct}%"></i></span>`:""}</span></button>`;

function subTile(s, on){
  const done = s.ids.filter(id=>isWritten(id) && readCount(id)===storiesOf(id).length).length;
  return `<button class="tile ${on?"on":""}" style="${tstyle(s.pal)}" data-ssub="${esc(s.name)}" aria-pressed="${on}"><span class="ic">${subIcon(s)}</span><span><b>${esc(s.name)}</b><small>${s.ids.length} books${done?` · ${done} finished`:""}</small></span></button>`;
}
const FILTERS = [["all","All"],["new","Not started"],["going","In progress"],["done","Finished"],["saved","Saved"]];
function applyFilter(ids){
  const st = id => { const n = storiesOf(id).length, r = readCount(id); return !n||!r ? "new" : r===n ? "done" : "going"; };
  return ids.filter(id => shelfFilter==="all" || (shelfFilter==="saved" ? isBookSaved(id) : st(id)===shelfFilter));

function vShelf(){
  const q = shelfQuery.trim().toLowerCase();
  const search = `<div class="search">${ico(UI.search)}<input class="field" id="shelfSearch" placeholder="Search ${BOOKS.length} books and ${SUBS.length} shelves" aria-label="Search books" value="${esc(shelfQuery)}"></div>`;
  const famRow = `<div class="fams" role="tablist" aria-label="Book families">${["All",...SUBFAMS].map(f=>`<button class="fam ${f===shelfFam?"on":""}" data-sfam="${f}" role="tab" aria-selected="${f===shelfFam}">${f}</button>`).join("")}</div>`;
  if(q){
    const subHits = SUBS.filter(s=>s.name.toLowerCase().includes(q));
    const list = BOOKS.filter(b => (b.title+" "+b.author+" "+b.topic+" "+subsForBook(b.id).map(s=>s.name).join(" ")).toLowerCase().includes(q));
    return `${search}
      ${subHits.length?`<p class="fam-lbl">Shelves</p><div class="tiles">${subHits.map(s=>subTile(s,false)).join("")}</div>`:""}
      <p class="fam-lbl">Books</p><div class="shelf">${list.map(coverHTML).join("")}</div>
      ${!list.length&&!subHits.length?`<div class="empty"><strong>Nothing found</strong>Try another word.</div>`:""}`;
  }
  if(shelfFam==="All"){
    const reading = BOOKS.filter(b=>{ const n=storiesOf(b.id).length, r=readCount(b.id); return r>0 && r<n; }).slice(0,8);
    const saved = (S.books||[]).map(k=>BOOKMAP[k.id]).filter(Boolean).slice(0,8);
    return `${search}${famRow}
      ${reading.length?`<p class="fam-lbl">Continue reading</p><div class="rail">${reading.map(coverHTML).join("")}</div>`:""}
      ${saved.length?`<p class="fam-lbl">Your saved books</p><div class="rail">${saved.map(coverHTML).join("")}</div>`:""}
      ${SUBFAMS.map(f=>`<div class="fam-head"><p class="fam-lbl">${f}</p><button class="btn ghost" data-sfam="${f}">See all ${ico(UI.arrow)}</button></div><div class="tiles">${subsOf(f).map(s=>subTile(s,false)).join("")}</div>`).join("")}`;
  }
  const subs = subsOf(shelfFam);
  const cur = (shelfSub && SUBMAP[shelfSub] && SUBMAP[shelfSub].fam===shelfFam) ? SUBMAP[shelfSub] : subs[0];
  const ids = applyFilter(cur.ids);
  return `${search}${famRow}
    <div class="tiles" role="group" aria-label="${shelfFam} shelves">${subs.map(s=>subTile(s, s===cur)).join("")}</div>
    <div class="sub-head" style="${tstyle(cur.pal)}"><h2 class="sec">${esc(cur.name)}</h2><span class="note">${cur.ids.length} books</span></div>
    <div class="chips">${FILTERS.map(([k,l])=>`<button class="chip ${k===shelfFilter?"on":""}" style="${tstyle(cur.pal)}" data-sfilter="${k}">${l}</button>`).join("")}</div>
    <div class="shelf">${ids.map(id=>coverHTML(BOOKMAP[id])).join("")}</div>
    ${!ids.length?`<div class="empty"><strong>No books here</strong>${shelfFilter==="saved"?"Save a book from its page and it shows up here.":"Try another filter."}</div>`:""}`;
}
function vBook(id){
  const b = BOOKMAP[id], st = storiesOf(id), r = readCount(id);

  return `<button class="btn ghost" data-back style="margin:0 0 8px -8px">${ico(UI.back)}Shelf</button>

      ${st.length?`<div class="actions"><button class="btn primary" data-open="${esc(storyId(id, r===st.length?0:nextI))}">${ico(UI.arrow)}${r===0?"Start reading":r===st.length?"Read again":"Continue reading"}</button>${bookSaveBtn(id)}${r?`<span class="note">${r} of ${st.length} read</span>`:""}</div>`

/* ---------- writing books with Claude ----------
   One story per request, in a simple text format (long passages inside JSON
   were what made answers come back broken). Progress is saved after every
   story, so an interruption resumes instead of starting the book again. */
let writing = {busy:null, err:"", all:false, stop:false, last:"", step:""};
function outlinePrompt(b){
  return `Plan a reading of "${b.title}" by ${b.author} (${b.year})${b.music?", a music book,":""} as 8 to 10 stand-alone stories for a reading app for people who find full books too padded.
Each story will deliver ONE of the book's genuinely important ideas. Choose the ideas that matter most, in a sensible reading order, with no overlap.
For each, give "title" (the idea in 3 to 7 words, sentence case, Australian English) and "focus" (one sentence on what the story will explain).
Reply with only JSON: {"ideas":[{"title":"","focus":""}]}`;
}
function storyPrompt(b, outline, i){
  const it = outline[i];
  return `You are writing one story for a reading app that breaks "${b.title}" by ${b.author} (${b.year}) into stand-alone stories, each delivering one idea with no waffle.
The book's planned stories, for context so you don't overlap: ${outline.map((o,j)=>`${j+1}. ${o.title}`).join("; ")}.
Write story ${i+1}: "${it.title}". Focus: ${it.focus}${b.music?`
This is a music book. Be precise and correct about musicians, recordings, dates and musical terms; if you aren't sure of a specific detail, leave it out. Make the real-life example about a musician's practice, performance, listening or creative life.${b.theory?` This is a theory book: explain each concept with actual notes and chords in a common key such as C, F or B flat, double-check every note spelling and interval, and make the example a short exercise to try on an instrument, including bass where it fits.`:""}`:""}

Rules:
- The main text is about 420 to 470 words in 4 to 6 short paragraphs. Explain clearly what the author argues, the reasoning or evidence, why it matters, and any important nuance or limit. Concrete and warm, never padded. If the idea is disputed or the evidence is weak, say so briefly.
- Then a real-life example: 3 or 4 sentences showing a specific everyday situation where the idea applies and what someone would do differently.
- Then a takeaway: one sentence under 20 words.
- Entirely your own words. No direct quotations, and do not reproduce or closely paraphrase the book's passages; explain the idea rather than retelling chapters.
- Australian English. No em dashes. No markdown, no headings inside the text.

Reply in exactly this format and nothing else:
TITLE: the story's title
TEXT:
the paragraphs, separated by blank lines
EXAMPLE: the real-life example
TAKEAWAY: the takeaway`;
}
function parseStory(raw){
  const t = String(raw||"").replace(/\r/g,"").replace(/\*\*/g,"").replace(/^#+\s*/gm,"");
  const m = t.match(/TITLE:\s*(.+?)\s*\n+\s*TEXT:\s*\n?([\s\S]*?)\n\s*EXAMPLE:\s*([\s\S]*?)\n\s*TAKEAWAY:\s*([\s\S]+)$/i);
  if(!m) return null;
  const s = cleanStory({title:m[1].trim(), text:m[2].trim().replace(/\n{3,}/g,"\n\n"), example:m[3].trim(), takeaway:m[4].trim().split("\n")[0]});
  return s.text.split(/\s+/).length >= 200 && s.example && s.takeaway ? s : null;
}
function checkPrompt(b, stories){
  return `Fact-check these stories, written to explain ideas from "${b.title}" by ${b.author}, for accuracy.
For each story, check that it fairly represents what the book actually argues, and that facts, names, dates and research claims are right and not overstated.
For any error, give a small replacement: "find" must be an exact sentence or phrase copied from the story, and "with" its corrected version (own words, Australian English, no em dashes). Only change what is actually wrong. Leave accurate stories alone.
Reply with only JSON: {"results":[{"n":0,"verdict":"ok","replace":[{"find":"","with":""}]}]} where n is the story's index and verdict is "ok" or "fixed".
Stories:
${JSON.stringify(stories.map((s,n)=>({n, title:s.title, text:s.text, example:s.example, takeaway:s.takeaway})))}`;
}
function applyFixes(st, res){
  for(const r of (res && Array.isArray(res.results) ? res.results : [])){
    if(!isObj(r) || !Number.isInteger(r.n) || !st[r.n] || !Array.isArray(r.replace)) continue;
    for(const fx of r.replace){
      if(!isObj(fx) || typeof fx.find!=="string" || typeof fx.with!=="string" || fx.find.length < 4) continue;
      for(const k of ["title","text","example","takeaway"]) if(st[r.n][k].includes(fx.find)){ st[r.n][k] = st[r.n][k].replace(fx.find, fx.with.replace(/\u2014/g, ", ")); break; }
    }
  }
}
function errMessage(err){
  const c = err && err.code;
  if(c==="not_granted" || c==="sampling_disabled" || c==="not_declared" || c==="capability_disabled" || c==="capability_removed"){ sample = null; return "Claude isn't available on this view."; }
  if(c==="rate_limited") return "You've reached your Claude usage limit for now. Progress is saved, so tap Resume later.";
  if(c==="session_expired") return "Please sign in to Claude again, then tap Resume.";
  if(c==="refused") return "Claude declined to write this book. It's been skipped for now.";
  if(c==="incomplete" || c==="invalid_json" || c==="empty_completion") return "An answer came back incomplete. Progress is saved, so tap Resume to carry on.";
  return "A connection hiccup interrupted writing. Progress is saved, so tap Resume to carry on.";
}
function draftCount(id){ const d = DR[id]; return d ? `${d.stories.length} of ${d.outline.length}` : ""; }
async function writeBook(id, quiet){
  const b = BOOKMAP[id]; if(!sample || !b || writing.busy) return {ok:false};
  writing.busy = id; writing.err = ""; writing.book = id;
  const show = msg => { writing.step = msg; if(quiet) refreshWriter(); else render(); };
  try{
    let d = DR[id];
    if(!d){
      show(`Planning ${b.title}…`);
      const o = await sample.json(outlinePrompt(b), {modelTier:"default"});
      const outline = (o && Array.isArray(o.ideas) ? o.ideas : []).filter(x=>isObj(x) && str(x.title).trim()).slice(0,10).map(x=>({title:str(x.title).slice(0,120), focus:str(x.focus).slice(0,300)}));
      if(outline.length < 5) throw {code:"incomplete"};
      d = DR[id] = {outline, stories:[]}; saveStore("drafts");
    }
    while(d.stories.length < d.outline.length){
      const i = d.stories.length;
      show(`Writing ${b.title}: story ${i+1} of ${d.outline.length}…`);
      const r = await sample(storyPrompt(b, d.outline, i), {modelTier:"default"});
      const s = r && !r.truncated ? parseStory(r.text) : null;
      if(!s) throw {code:"incomplete"};
      d.stories.push(s); saveStore("drafts");
      if(writing.stop && quiet) throw {code:"paused"};
    }
    const st = d.stories.map(s=>Object.assign({}, s));
    let checked = false;
    try{ show(`Fact-checking ${b.title}…`); applyFixes(st, await sample.json(checkPrompt(b, st), {modelTier:"default"})); checked = true; }
    catch(e){ if(e && e.code==="rate_limited") throw e; }
    W[id] = {stories:st.map(cleanStory), checked, full:true, t:Date.now()};
    delete DR[id]; saveStore("written"); saveStore("drafts");
    writing.busy = null; writing.step = ""; if(!quiet) render();
    return {ok:true};
  }catch(err){
    writing.busy = null; writing.step = "";
    if(err && err.code==="paused"){ writing.err = ""; if(!quiet) render(); return {ok:false, paused:true}; }
    writing.err = errMessage(err); if(!quiet) render();
    return {ok:false, code:err && err.code};
  }
}
async function writeAll(){
  if(!sample || writing.all) return;
  writing.all = true; writing.stop = false; writing.last = ""; refreshWriter();
  const skipped = new Set();
  for(const b of BOOKS){
    if(writing.stop || !sample) break;
    if((W[b.id] && W[b.id].full) || b.original || handDone(b.id)) continue;
    const r = await writeBook(b.id, true);
    if(!r.ok){
      if(r.paused){ writing.last = "Paused. Tap Resume to carry on."; break; }
      if(r.code==="refused"){ skipped.add(b.title); continue; }
      writing.last = writing.err; break;
    }
    if(tab==="shelf" && !view) render();
  }
  writing.all = false;
  if(BOOKS.every(b=>(W[b.id] && W[b.id].full) || b.original || handDone(b.id))) writing.last = `All ${BOOKS.length} books are written.`;
  else if(skipped.size && !writing.last) writing.last = `Skipped: ${[...skipped].join(", ")}.`;
  refreshWriter();
}
function writerHTML(){
  if(!sample) return "";
  const done = BOOKS.filter(b=>(W[b.id] && W[b.id].full) || b.original || handDone(b.id)).length, pct = Math.round(done/BOOKS.length*100);
  return `<section class="journey" id="writerBox" style="margin-top:18px"><h3>Write the remaining books</h3>
    <p class="note" style="margin:0 0 12px">Claude plans each book's key ideas, writes each story of about 500 words in its own words, then fact-checks the book. It saves after every story, so nothing is lost if it's interrupted. It runs while the app is open and uses your Claude usage.</p>
    <div class="famrow"><span style="width:auto;flex:none">${done} of ${BOOKS.length}</span><div class="meter"><i style="width:${pct}%;background:var(--accent)"></i></div><small>${pct}%</small></div>
    ${writing.step||writing.last?`<p class="note" style="margin:6px 0 10px">${esc(writing.step||writing.last)}</p>`:""}
    <div class="actions" style="margin-top:6px">${writing.all?`<button class="btn" data-writestop>Pause</button>`:done<BOOKS.length?`<button class="btn primary" data-writeall>${ico(UI.spark)}${done||Object.keys(DR).length?"Resume":"Write all"}</button>`:""}</div></section>`;
}
function refreshWriter(){ const box = document.getElementById("writerBox"); if(box) box.outerHTML = writerHTML(); else if(view && view.type==="book" && view.id===writing.book) render(); }

/* ---------- backup ---------- */
const stamp = () => new Date().toISOString().slice(0,10);
async function offerFile(filename, text, fallbackMsg){
  const type = filename.endsWith(".json") ? "application/json" : "text/markdown";
  if(dl){ try{ await dl.save({filename, data:new Blob([text],{type})}); toast("Saved"); return; }catch(e){ if(e && e.code==="declined") return; } }
  else { try{ const url = URL.createObjectURL(new Blob([text],{type})); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Saved to your downloads"); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); toast(fallbackMsg); }catch(e){ toast("Saving isn't available here"); }
}
function exportNotes(){
  const ids = [...new Set([...S.kept.map(k=>k.id), ...Object.keys(N)])].map(story).filter(Boolean);
  const L = ["# Shelf", "", `Exported ${new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"})}.`, ""];
  for(const s of ids){ const b = BOOKMAP[s.book]; L.push(`## ${s.title}`, "", `*${b.title}*, ${b.author}`, "", s.text, "", `**In real life:** ${s.example}`, "", `**The takeaway:** ${s.takeaway}`, ""); if(N[s.id]) L.push(`**My reflection:** ${N[s.id].text}`, ""); L.push("---", ""); }

function exportBackup(){ offerFile(`shelf-backup-${stamp()}.json`, JSON.stringify({app:"shelf", version:1, exported:new Date().toISOString(), state:S, notes:N, written:W}), "Backup copied to your clipboard"); }
function restoreBackup(text){
  let b; try{ b = JSON.parse(text); }catch(e){ toast("That file isn't a Shelf backup"); return; }
  if(!b || b.app!=="shelf" || !isObj(b.state)){ toast("That file isn't a Shelf backup"); return; }
  const have = new Set(S.kept.map(k=>k.id));
  S.kept = [...S.kept, ...(Array.isArray(b.state.kept)?b.state.kept:[]).filter(k=>isObj(k) && !have.has(k.id))];
  S.read = [...new Set([...S.read, ...(Array.isArray(b.state.read)?b.state.read:[])])];
  S.days = [...new Set([...S.days, ...(Array.isArray(b.state.days)?b.state.days:[])])];
  const haveB = new Set((S.books||[]).map(k=>k.id));
  S.books = [...(S.books||[]), ...(Array.isArray(b.state.books)?b.state.books:[]).filter(k=>isObj(k) && !haveB.has(k.id))];
  for(const [k,n] of Object.entries(isObj(b.notes)?b.notes:{})) if(!N[k] || (isObj(n) && (n.t||0) > (N[k].t||0))) N[k] = n;
  for(const [k,w] of Object.entries(isObj(b.written)?b.written:{})) if(!W[k]) W[k] = w;
  normalise(); for(const n of STORES) saveStore(n); render(); toast("Backup restored and merged");
}

/* ---------- render ---------- */
function render(){
  try{ renderInner(); }
  catch(err){ console.error(err); const v = document.getElementById("view"); if(v) v.innerHTML = `<div class="empty"><strong>That view didn't load</strong>Your progress is safe.<div class="actions" style="justify-content:center"><button class="btn primary" data-tab="today">Go to Today</button></div></div>`; }
}
function renderInner(){
  const due = S.kept.filter(k=>(k.due??0)<=dayNum() && story(k.id)).length;
  document.getElementById("diceBtn").innerHTML = ico(UI.dice);
  const tb = document.getElementById("themeBtn"); tb.innerHTML = ico(isEve()?UI.sun:UI.moon); tb.setAttribute("aria-label", isEve()?"Switch to dawn theme":"Switch to evening theme");
  const tabs = [["today","Today",UI.today],["shelf","Shelf",UI.book],["saved","Saved",UI.bookmark],["review","Review",UI.review]];
  document.getElementById("tabs").innerHTML = tabs.map(([k,l,ic])=>`<button class="tab ${k===tab?"on":""}" data-tab="${k}" ${k===tab?'aria-current="page"':""}>${ico(ic)}${l}${k==="review"&&due?`<span class="badge">${due}</span>`:""}</button>`).join("");
  const v = document.getElementById("view");
  v.innerHTML = view ? (view.type==="book" ? vBook(view.id) : view.type==="story" ? vStory(view.id) : vFinished(view.id))
    : tab==="today" ? vToday() : tab==="shelf" ? vShelf() : tab==="saved" ? vSaved() : vReview();
  const ss = document.getElementById("shelfSearch");
  if(ss) ss.oninput = e => { shelfQuery = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById("shelfSearch"); n.focus(); n.setSelectionRange(pos,pos); };
}
function go(v){ stopSpeech(); view = v; render(); scrollTo(0,0); }
function openStory(sid){
  const s = story(sid); if(!s) return;
  S.last = {book:s.book, i:s.i}; markRead(sid); markDay(); persist();
  go({type:"story", id:sid});
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return; const d = b.dataset;
  if(d.tab){ stopSpeech(); tab = d.tab; view = null; reviewShow = false; render(); scrollTo(0,0); }
  else if(d.book){ tab = "shelf"; go({type:"book", id:d.book}); }
  else if(d.open){ openStory(d.open); }
  else if(d.finish){ go({type:"finished", id:d.finish}); }
  else if("back" in d){ go(null); }
  else if(d.sfam){ shelfFam = d.sfam; shelfSub = null; shelfFilter = "all"; tab = "shelf"; view = null; render(); scrollTo(0,0); }
  else if(d.ssub){ const s = SUBMAP[d.ssub]; if(s){ const fromTiles = tab==="shelf" && !view && shelfFam===s.fam && !shelfQuery; const x = document.querySelector(".tiles")?.scrollLeft; shelfFam = s.fam; shelfSub = s.name; shelfFilter = "all"; shelfQuery = ""; tab = "shelf"; view = null; stopSpeech(); render(); if(fromTiles){ const t = document.querySelector(".tiles"); if(t && x!=null) t.scrollLeft = x; } else { scrollTo(0,0); const on = document.querySelector(".tile.on"); if(on) on.scrollIntoView({block:"nearest", inline:"center"}); } } }
  else if(d.sfilter){ shelfFilter = d.sfilter; render(); }
  else if(d.savebook){ toggleBook(d.savebook); }
  else if(d.smode){ savedMode = d.smode; render(); }
  else if(d.savedfam){ savedFam = d.savedfam; render(); }
  else if(d.keep){ toggleKeep(d.keep); }
  else if(d.listen){ speak(d.listen); }
  else if(d.write){ writeBook(d.write); }
  else if("writeall" in d){ writeAll(); }
  else if("writestop" in d){ writing.stop = true; writing.step = "Pausing after the current story…"; refreshWriter(); }
  else if("reveal" in d){ reviewShow = true; render(); }
  else if(d.grade){ const k = S.kept.find(x=>(x.due??0)<=dayNum() && story(x.id)); if(k){ k.interval = d.grade==="good" ? Math.min((k.interval||1)*2,90) : 1; k.due = dayNum()+k.interval; persist(); } reviewShow = false; render(); }
  else if("exportmd" in d){ exportNotes(); }
  else if("exportjson" in d){ exportBackup(); }
  else if("restore" in d){ document.getElementById("restoreFile").click(); }
});
document.addEventListener("change", e => { if(e.target.id==="restoreFile" && e.target.files && e.target.files[0]){ e.target.files[0].text().then(restoreBackup); e.target.value = ""; } });
const noteTimers = {};
document.addEventListener("input", e => {
  const sid = e.target.dataset && e.target.dataset.note; if(!sid) return;
  const text = e.target.value; clearTimeout(noteTimers[sid]);
  noteTimers[sid] = setTimeout(()=>{
    if(text.trim()) N[sid] = {text, t:Date.now()}; else delete N[sid];
    saveStore("notes");
    if(text.trim() && !isKept(sid)){ S.kept.unshift({id:sid, keptAt:Date.now(), interval:1, due:dayNum()+1}); persist(); refreshKeep(sid); }
    document.querySelectorAll(`[data-saved="${CSS.escape(sid)}"]`).forEach(p=>p.textContent = text.trim() ? "Saved" : "Only you can see this. Writing here saves the story.");
  }, 600);
});
document.addEventListener("keydown", e => {
  if(view && view.type==="story" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    const s = story(view.id); if(!s) return;
    if(e.key==="ArrowRight" && s.i < storiesOf(s.book).length-1) openStory(storyId(s.book, s.i+1));
    if(e.key==="ArrowLeft" && s.i > 0) openStory(storyId(s.book, s.i-1));
  }
});
document.getElementById("diceBtn").addEventListener("click", () => { const all = allStories(); if(all.length) openStory(all[Math.floor(Math.random()*all.length)]); });
document.getElementById("themeBtn").addEventListener("click", () => { const next = isEve() ? "light" : "dark"; document.documentElement.dataset.theme = next; try{ localStorage.setItem("cp-theme", next); }catch(e){} render(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && tab==="today" && !view) render(); });
window.addEventListener("unhandledrejection", e => e.preventDefault());

/* ---------- boot ---------- */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")&&!location.hostname.endsWith("claude.ai"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
(async () => {
  if(!(window.claude && window.claude.use)) return;
  claude.use("sample").then(s => { if(s){ sample = s; render(); } });
  claude.use("downloads").then(x => { dl = x; });
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    cloud = { doc: name => db.doc("data/users/" + uid + "/" + name) };
    let changed = false;
    for(const n of STORES){
      let remote = null; try{ remote = await cloudLoad(n); }catch(e){}
      if(remote && remote.updatedAt > U[n]){ setStore(n, remote.data); U[n] = remote.updatedAt; lsSet("sh-"+n, {data:getStore(n), updatedAt:U[n]}); changed = true; }
      else if(U[n] && (!remote || U[n] > remote.updatedAt)) cloudSave(n);
    }
    normalise(); if(changed) render();
  }catch(e){ cloud = null; }
})();

</script>
</body>
